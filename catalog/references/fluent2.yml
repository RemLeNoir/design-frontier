id: fluent2
name: Microsoft Fluent 2
kind: design-system
status: reviewed
official_design_system: true
last_reviewed: '2026-07-16'
summary: Enterprise productivity components, adaptive layouts, accessibility and cross-platform interaction patterns.
covers_layers:
  application_shell: 0.84
  navigation: 0.84
  forms: 0.84
  tables: 0.76
  feedback: 0.86
  accessibility: 0.88
  mobile: 0.72
recommended_for:
